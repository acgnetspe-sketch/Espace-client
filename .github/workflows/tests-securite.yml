# Vérifications automatiques à chaque envoi de code sur GitHub.
# Si une modification casse la sécurité ou l'application, la coche devient rouge.
name: Tests de sécurité

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isolement:
    name: Isolement entre clients
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lancer les tests sur un PostgreSQL jetable
        run: bash supabase/tests/local/lancer_tests.sh

  application:
    name: Application (formats et construction)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests des formats (dates, surfaces)
        run: npm test
      - name: Construction de l'application
        run: npm run build
